services:
  # --- DATABASE & BACKEND ---
  redis:
    image: redis:6-alpine
    restart: always

  db:
        image: postgres:13-alpine
        restart: always
        environment:
          - POSTGRES_USER=blackbox_user
          - POSTGRES_PASSWORD=password
          - POSTGRES_DB=blackbox_guardian_db
        ports:
          - "5432:5432"
        volumes:
          - db_data:/var/lib/postgresql/data
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U blackbox_user -d blackbox_guardian_db"]
          interval: 5s
          timeout: 5s
          retries: 5

  backend:
    build: ./backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis: # <-- Add this dependency
        condition: service_started
    environment:
      - ZAP_HOST=${ZAP_HOST:-zap}
      - ZAP_PORT=${ZAP_PORT:-8090}

  celery_worker:
    build: ./backend
    restart: always
    command: celery -A celery_worker worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - ZAP_HOST=${ZAP_HOST:-zap}
      - ZAP_PORT=${ZAP_PORT:-8090}

  # --- TOOL ARMORY ---
  nmap:
    build: ./tool_configs/nmap
    command: ["sleep", "infinity"]

  sqlmap:
    build: ./tool_configs/sqlmap
    command: ["sleep", "infinity"]

  zap:
    image: owasp/zap2docker-stable
    profiles: ["tools"]
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8090"]
      interval: 10s
      timeout: 5s
      retries: 5
    # UPDATED COMMAND TO ALLOW CONNECTIONS
    command: >
      zap.sh -daemon -port 8090 -host 0.0.0.0
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true

  streamlit:
    image: python:3.11-slim
    restart: unless-stopped
    volumes:
      - ./frontend:/app
    working_dir: /app
    ports:
      - "8501:8501"
    command: bash -c "pip install --no-cache-dir streamlit requests && streamlit run app.py --server.port 8501 --server.address 0.0.0.0"

volumes:
  db_data: